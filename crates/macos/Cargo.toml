[package]
name = "agent-snap-macos"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
agent-snap-core = { path = "../core" }
anyhow.workspace = true
log.workspace = true
image.workspace = true

objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSDictionary", "NSString", "NSValue", "NSError", "NSEnumerator", "NSObject", "NSURL", "NSGeometry", "NSThread"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication", "NSScreen"] }
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-screen-capture-kit = "0.3"
objc2-vision = "0.3"
objc2-application-services = "0.3"
block2 = "0.6"
dispatch2 = "0.3"
libc = "0.2"

[dev-dependencies]
env_logger.workspace = true
